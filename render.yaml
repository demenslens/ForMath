# Render Blueprint — ForMath demo (twee diensten, auto-deploy bij push naar main)
#
# LET OP: het render.yaml-schema van Render wijzigt af en toe. Dit bestand is een
# vertrekpunt; controleer de sleutels tegen de actuele Render-docs, of maak de twee
# diensten met de hand aan in het dashboard (zie DEPLOY_RENDER.md — dat is
# schema-onafhankelijk en de aanbevolen route voor de eerste keer).
#
# Dienst 1 = statische site (portaal + ForMath-studenttool + opgaven) — GRATIS.
# Dienst 2 = Python-webservice (ForMath-authortool: AST genereren, niet opslaan).

services:
  # ── Statische site ───────────────────────────────────────────────────────────
  - type: web
    name: formath-web
    runtime: static
    buildCommand: bash scripts/build_site.sh
    staticPublishPath: dist
    autoDeploy: true
    headers:
      - path: /formath/testopgaven/*
        name: Cache-Control
        value: "max-age=60"          # nieuwe opgaven snel zichtbaar
      - path: /*
        name: Cache-Control
        value: "max-age=300"

  # ── Python-webservice (authortool) ───────────────────────────────────────────
  - type: web
    name: formath-authortool
    runtime: python
    buildCommand: "echo geen dependencies"   # pipeline is puur stdlib
    startCommand: python authortool/formath_web/server.py
    autoDeploy: true
    envVars:
      - key: AUTHORTOOL_DEMO
        value: "1"                    # schrijven/opslaan geblokkeerd
      - key: FORMATH_OUTPUT_DIR
        value: studenttool/testopgaven # opgaven die de authortool kan openen
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.0"               # elke 3.x volstaat (stdlib-only)
