# Render Blueprint — ForMath (ÉÉN dienst serveert alles op formath.onrender.com)
#
# Deze ene Python-webservice serveert:
#   /               → keuzescherm (landing)
#   /authortool/    → ForMath-authortool (AST genereren; schrijven geblokkeerd)
#   /student/...    → ForMath-studenttool (opgave uitwerken) + opgaven
#   /api/*          → de authortool-backend
#
# Aanmaken kan met de hand in het dashboard (aanbevolen; zie DEPLOY_RENDER.md) of
# via deze Blueprint. Controleer het schema tegen de actuele Render-docs.

services:
  - type: web
    name: formath                         # → formath.onrender.com (mits vrij)
    runtime: python
    buildCommand: "echo geen dependencies" # pipeline is puur stdlib
    startCommand: python authortool/formath_web/server.py
    autoDeploy: true
    envVars:
      - key: AUTHORTOOL_DEMO
        value: "1"                        # schrijven/opslaan geblokkeerd
      - key: FORMATH_OUTPUT_DIR
        value: studenttool/testopgaven    # opgaven die de authortool kan openen
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.0"
